services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.15-alpine
    restart: always
    # Memory ceiling, with postgres told to stay inside it.
    #
    # The limit alone is not enough. shared_buffers is shared anonymous memory
    # and work_mem is plain anonymous memory: neither is page cache, so
    # neither is reclaimable, and the cgroup OOM killer fires when they exceed
    # the cap. The defaults are sized for a dedicated host: autovacuum alone
    # can take autovacuum_work_mem (64MB) x autovacuum_max_workers (3) without
    # anyone running a query.
    #
    # Bounded here at ~464 MiB worst case: 128 shared_buffers + 30 backends x
    # work_mem + 96 autovacuum. max_connections is 30 rather than the default
    # 100: each API instance holds its pool (DB_POOL_MAX, 10) plus one LISTEN
    # connection for realtime and, briefly at boot, one migration connection.
    # That leaves room for two API instances, the backup sidecar's pg_dump and
    # the healthchecks.
    #
    # The 15 MiB reading taken on main 2026-09-11 is not the sizing case:
    # docker stats subtracts inactive page cache, so it understates a cold or
    # idle database. Steady state is several times that.
    deploy:
      resources:
        limits:
          memory: 512m
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c autovacuum_work_mem=32MB
      -c max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowtask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-flowtask}
    volumes:
      - tasksflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flowtask}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowtask-network

  # API server. Also serves the built SPA and applies migrations on boot (under
  # an advisory lock), so this is the only app container. Route the domain to
  # this service on port 3001.
  tasksflow-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Build-time flags for the SPA: they only switch the OAuth buttons and
        # the GitHub App install link on, so they default to the server values.
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID:-${GITHUB_CLIENT_ID:-}}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        VITE_GITHUB_APP_SLUG: ${VITE_GITHUB_APP_SLUG:-}
    restart: always
    # Memory ceiling. Measured on main 2026-09-11: 109 MiB. 512m is ~4x that,
    # which covers SSE fan-out to many open streams and the in-memory gzip
    # copies of the SPA assets (about 1 MB).
    deploy:
      resources:
        limits:
          memory: 512m
    # SIGTERM drains requests, ends SSE streams and closes the pool
    # (SHUTDOWN_TIMEOUT_MS, 10s per phase); give it time before SIGKILL.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # The API builds the connection URL from these (URL-encoded), so any
      # characters are safe in the password.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-flowtask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-flowtask}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required (public https URL)}
      WEB_URL: ${WEB_URL:-${BETTER_AUTH_URL}}
      # Proxies in front of the API that append to X-Forwarded-For (Traefik).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      APP_MANAGER_EMAILS: ${APP_MANAGER_EMAILS:-}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-${VITE_GITHUB_APP_SLUG:-}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JOBS_DISABLED: ${JOBS_DISABLED:-false}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-}
    expose:
      - '3001'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowtask-network

  # Daily pg_dump to the tasksflow_backups volume, keeping 7 daily, 4 weekly
  # and 6 monthly dumps. The volume is on the same host: copy it off-host
  # (Dokploy volume backups, rsync, restic) for real disaster recovery.
  # Restore: gunzip -c <dump>.sql.gz | docker compose exec -T postgres psql -U <user> <db>
  tasksflow-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine-d257e5d
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-flowtask}
      POSTGRES_USER: ${POSTGRES_USER:-flowtask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_EXTRA_OPTS: --clean --if-exists --no-owner -Z 6
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - tasksflow_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowtask-network

volumes:
  tasksflow_postgres_data:
  tasksflow_backups:

networks:
  flowtask-network:
    driver: bridge
