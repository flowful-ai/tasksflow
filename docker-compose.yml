# Local development infrastructure: just Postgres. Run the API and web app
# with `bun run dev`.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: flowtask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowtask
      POSTGRES_PASSWORD: flowtask
      POSTGRES_DB: flowtask
    ports:
      # Loopback only: the default credentials must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtask"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
